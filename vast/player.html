<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{width:100%;height:100%;background:transparent;overflow:hidden;}
        video{width:100%;height:100%;object-fit:contain;background:#000;}
        .skip-btn{position:fixed;bottom:20px;right:20px;background:rgba(0,0,0,0.8);color:#fff;
          border:1px solid #555;border-radius:20px;padding:8px 18px;font-size:13px;
          z-index:20;display:none;cursor:pointer;font-family:sans-serif;}
        .ad-badge{position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.7);color:#fff;
          padding:4px 8px;border-radius:4px;font-size:11px;z-index:20;font-family:sans-serif;}
    </style>
</head>
<body>
    <div id="ad-badge" class="ad-badge">Ad</div>
    <button class="skip-btn" id="skip-btn" onclick="skipAd()">Skip Ad ›</button>
    <video id="ad-video" autoplay playsinline muted></video>

    <script>
        var adConfig = { enabled: true, vastUrl: 'https://physicaldad.com/dMm/F.zrdEGENfvaZ/G/Um/Ie/mc9vufZiUblek_P/TEYB4HNRTdAR5vMIDYUHt/Nnjugj1/M-DmkswmO/SzZIsQacWD1GplduDK0Gxv' };

        function skipAd() {
            window.location.href = 'bridge://ad/dismiss';
        }

        function adEnded() {
            window.location.href = 'bridge://ad/dismiss';
        }

        function pingTracking(xml) {
            var trackPattern = /<!\[CDATA\[\s?(https:\/\/[^\s\]]+)\s?\]\]>/g;
            var match;
            while ((match = trackPattern.exec(xml)) !== null) {
                var url = match[1].trim();
                if (url.indexOf('.mp4') === -1) {
                    try {
                        fetch(url, { mode: 'no-cors' });
                    } catch(e) {}
                }
            }
        }

        function pingClickThrough(xml) {
            var clickPattern = /<ClickThrough>\s?<!\[CDATA\[\s?(https:\/\/[^\s\]]+)\s?\]\]>\s?<\/ClickThrough>/;
            var match = xml.match(clickPattern);
            if (match) {
                var clickUrl = match[1].trim();
                document.body.addEventListener('click', function() {
                    window.open(clickUrl, '_blank');
                });
            }
        }

        if (adConfig.enabled) {
            fetch(adConfig.vastUrl)
                .then(r => r.text())
                .then(xml => {
                    pingTracking(xml);
                    pingClickThrough(xml);

                    var doc = new DOMParser().parseFromString(xml, 'text/xml');
                    var mediaFile = doc.querySelector('MediaFile');
                    if (mediaFile) {
                        var video = document.getElementById('ad-video');
                        video.src = mediaFile.textContent.trim();
                        video.onended = adEnded;
                        video.onerror = adEnded;
                        setTimeout(function() {
                            document.getElementById('skip-btn').style.display = 'block';
                        }, 5000);
                    } else { skipAd(); }
                })
                .catch(function() { skipAd(); });
        } else {
            skipAd();
        }
    </script>
</body>
</html>
